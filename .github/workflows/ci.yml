name: ci

# There is no code here to test. What can break in a documentation repository is
# the diagram failing to render and the links going stale, so that is what runs.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Links rot without anyone touching the repo.
    - cron: "0 7 1 * *"
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install diagram parser
        working-directory: ci
        run: npm install --no-audit --no-fund

      # GitHub renders an error box in place of an unparseable diagram, which is
      # worse than no diagram and is invisible until someone looks at the page.
      - name: Mermaid parses
        run: node ci/check-mermaid.mjs README.md

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Links resolve
        run: python ci/check-links.py

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: install R
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq r-base > /dev/null
      - name: recompute
        run: bash verify/verify.sh
      - name: perturbation test
        run: |
          cp docs/claims.csv /tmp/claims.csv.bak
          sed -i 's/^endurance,.*$/endurance,endurance,99 min,spec,99,27,min/' docs/claims.csv
          if bash verify/verify.sh 2>/dev/null; then
            echo "the corrupted claim table was accepted"
            cp /tmp/claims.csv.bak docs/claims.csv
            exit 1
          fi
          echo "rejected as it should be"
          cp /tmp/claims.csv.bak docs/claims.csv
          bash verify/verify.sh
